services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_app
    restart: always
    ports:
      - "9001:9001"
    environment:
      - N8N_PORT=9001
      - N8N_PROTOCOL=https
      - N8N_HOST=n8n.dmcenter.my.id
      - WEBHOOK_URL=https://n8n.dmcenter.my.id/
      - GENERIC_TIMEZONE=Asia/Jakarta
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - /www/wwwroot/n8n/n8n_data:/home/node/.n8n
