# Nginx Configuration untuk Absensi
# File: /www/server/panel/vhost/nginx/absensi.smkpgriblora.sch.id.conf

server {
    listen 80;
    listen 443 ssl http2;
    server_name absensi.smkpgriblora.sch.id;
    
    # SSL Certificate paths (sesuaikan dengan aaPanel)
    # ssl_certificate /www/server/panel/vhost/cert/absensi.smkpgriblora.sch.id/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/absensi.smkpgriblora.sch.id/privkey.pem;
    
    root /www/wwwroot/absensi/public;
    index index.php index.html;
    
    # Access and error logs
    access_log /www/wwwlogs/absensi.smkpgriblora.sch.id.log;
    error_log /www/wwwlogs/absensi.smkpgriblora.sch.id.error.log;
    
    # Laravel public files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Laravel specific
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        
        # Increase timeouts for large operations
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Client body size for file uploads
    client_max_body_size 20M;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
